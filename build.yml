          cat > 'app/src/main/java/fr/hack68/chauffage/Energie.java' <<'CH_EOF_13'
          package fr.hack68.chauffage;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.time.LocalDateTime;
          import java.time.temporal.ChronoUnit;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Map;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /**
           * Relevés du Tywatt : à chaque lecture de la box, on note l’index du compteur (Wh).
           * La différence entre deux relevés = la conso, rangée par jour en heures pleines / creuses.
           */
          public class Energie {
              static SharedPreferences prefs(Context c) { return c.getSharedPreferences("energie", Context.MODE_PRIVATE); }

              static synchronized void noter(Context c, Map<String, Object> v, JSONObject cfg) {
                  try {
                      String champIdx = null, champInst = null;
                      double idx = 0, inst = 0;
                      for (Map.Entry<String, Object> e : v.entrySet()) {
                          if (!(e.getValue() instanceof Number)) continue;
                          String n = e.getKey(), l = n.toLowerCase();
                          double d = ((Number) e.getValue()).doubleValue();
                          if (l.startsWith("energyindex") || l.startsWith("energytotindex")) {
                              if (champIdx == null || l.contains("watt")) { champIdx = n; idx = d; }
                          } else if (l.startsWith("energyinstant")) {
                              if (champInst == null || n.endsWith("P")) { champInst = n; inst = d; }
                          }
                      }
                      if (champIdx == null && champInst == null) return;
                      JSONObject e = new JSONObject(prefs(c).getString("data", "{}"));
                      LocalDateTime now = LocalDateTime.now();
                      e.put("maj", now.toString());
                      if (champInst != null) { e.put("instant", inst); e.put("champInstant", champInst); }
                      if (champIdx != null) {
                          e.put("champ", champIdx);
                          JSONObject der = e.optJSONObject("dernier");
                          if (der != null && champIdx.equals(der.optString("champ"))) {
                              double delta = idx - der.getDouble("idx");
                              LocalDateTime t0 = LocalDateTime.parse(der.getString("t"));
                              long sec = ChronoUnit.SECONDS.between(t0, now);
                              if (delta >= 0 && sec > 0 && delta < sec * 30.0) { // garde-fou : moins de 108 kW de moyenne
                                  LocalDateTime milieu = t0.plusSeconds(sec / 2);
                                  boolean hc = heureCreuse(cfg, milieu);
                                  String jour = milieu.toLocalDate().toString();
                                  JSONObject jours = e.optJSONObject("jours");
                                  if (jours == null) jours = new JSONObject();
                                  JSONObject j = jours.optJSONObject(jour);
                                  if (j == null) j = new JSONObject();
                                  String cle = hc ? "hc" : "hp";
                                  j.put(cle, j.optDouble(cle, 0) + delta);
                                  j.put("poste", Planif.poste(cfg, milieu.toLocalDate()));
                                  jours.put(jour, j);
                                  purger(jours);
                                  e.put("jours", jours);
                              }
                          }
                          JSONObject d = new JSONObject();
                          d.put("champ", champIdx); d.put("idx", idx); d.put("t", now.toString());
                          e.put("dernier", d);
                      }
                      prefs(c).edit().putString("data", e.toString()).apply();
                  } catch (Exception ignore) { }
              }

              static void purger(JSONObject jours) {
                  List<String> cles = new ArrayList<>();
                  Iterator<String> it = jours.keys();
                  while (it.hasNext()) cles.add(it.next());
                  if (cles.size() <= 800) return;
                  Collections.sort(cles);
                  for (int i = 0; i < cles.size() - 800; i++) jours.remove(cles.get(i));
              }

              static boolean heureCreuse(JSONObject cfg, LocalDateTime t) {
                  JSONObject tarif = cfg.optJSONObject("tarif");
                  if (tarif == null || !"hphc".equals(tarif.optString("type"))) return false;
                  JSONArray hcs = tarif.optJSONArray("hc");
                  int m = t.getHour() * 60 + t.getMinute();
                  for (int i = 0; hcs != null && i < hcs.length(); i++) {
                      JSONArray p = hcs.optJSONArray(i);
                      if (p == null) continue;
                      try {
                          int d = Planif.minutes(p.getString(0)), f = Planif.minutes(p.getString(1));
                          if (d < f ? (m >= d && m < f) : (m >= d || m < f)) return true;
                      } catch (Exception ignore) { }
                  }
                  return false;
              }
          }
