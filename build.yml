          package fr.hack68.chauffage;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import java.time.LocalDateTime;
          import java.time.ZoneId;
          import java.time.format.DateTimeFormatter;
          import java.util.Map;
          import org.json.JSONObject;

          /** Exécute les ordres et programme le prochain réveil. */
          public class Pilote {
              static final String ACTION = "fr.hack68.chauffage.PILOTE";
              static final String CONTROLE = "fr.hack68.chauffage.CONTROLE";
              static final long INTERVALLE_CONTROLE = 30 * 60 * 1000L;
              static final DateTimeFormatter HEURE = DateTimeFormatter.ofPattern("HH:mm");
              static final DateTimeFormatter JOUR_HEURE = DateTimeFormatter.ofPattern("dd/MM HH:mm");

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences("pilote", Context.MODE_PRIVATE); }

              static JSONObject config(Context c) {
                  try { return new JSONObject(prefs(c).getString("cfg", "{}")); } catch (Exception e) { return new JSONObject(); }
              }

              static boolean actif(JSONObject cfg) {
                  JSONObject b = cfg.optJSONObject("box");
                  return cfg.optBoolean("auto", false) && b != null
                          && b.optString("mac").length() == 12 && !b.optString("email").isEmpty() && !b.optString("mdp").isEmpty();
              }

              static synchronized void journal(Context c, String msg) {
                  String ligne = LocalDateTime.now().format(JOUR_HEURE) + "  " + msg;
                  String ancien = prefs(c).getString("journal", "");
                  String[] l = (ligne + "\n" + ancien).split("\n");
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < Math.min(30, l.length); i++) if (!l[i].isEmpty()) sb.append(l[i]).append("\n");
                  prefs(c).edit().putString("journal", sb.toString()).apply();
              }

              /** Appelé par le réveil : applique l’état voulu maintenant, puis programme le suivant. */
              static void executer(Context c) {
                  JSONObject cfg = config(c);
                  if (!actif(cfg)) { annuler(c); return; }
                  LocalDateTime now = LocalDateTime.now();
                  boolean allume = Planif.allumeA(cfg, now);
                  int essai = prefs(c).getInt("essai", 0);
                  try {
                      String r = Tydom.appliquer(c, cfg, allume);
                      journal(c, (allume ? "🔥 Allumé" : "❄️ Coupé") + " · " + r);
                      prefs(c).edit().putInt("essai", 0).putLong("forceJusqua", 0).apply();
                      planifierSuivante(c, cfg);
                  } catch (Exception e) {
                      journal(c, "⚠️ " + (allume ? "Allumage" : "Coupure") + " raté · " + e.getMessage());
                      if (essai < 3) {
                          prefs(c).edit().putInt("essai", essai + 1).apply();
                          reveil(c, System.currentTimeMillis() + 120000);
                          prefs(c).edit().putString("prochain", "Nouvel essai à " + now.plusMinutes(2).format(HEURE)).apply();
                      } else {
                          prefs(c).edit().putInt("essai", 0).apply();
                          planifierSuivante(c, cfg);
                      }
                  }
              }

              static void planifierSuivante(Context c, JSONObject cfg) {
                  if (!actif(cfg)) { annuler(c); return; }
                  LocalDateTime t = Planif.prochaine(cfg, LocalDateTime.now());
                  planifierControle(c, cfg);
                  if (t == null) { prefs(c).edit().putString("prochain", "Aucun changement prévu").apply(); return; }
                  long ms = t.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli() + 5000;
                  reveil(c, ms);
                  boolean allume = Planif.allumeA(cfg, t);
                  String quand = t.toLocalDate().equals(LocalDateTime.now().toLocalDate()) ? t.format(HEURE)
                          : (t.toLocalDate().equals(LocalDateTime.now().toLocalDate().plusDays(1)) ? "demain " + t.format(HEURE) : t.format(JOUR_HEURE));
                  prefs(c).edit().putString("prochain", (allume ? "🔥 Allumage" : "❄️ Coupure") + " " + quand).apply();
              }

              /** Après un changement de réglages : remet l’état voulu dans 15 s. */
              static void synchroniser(Context c) {
                  if (!actif(config(c))) { annuler(c); prefs(c).edit().putString("prochain", "").apply(); return; }
                  prefs(c).edit().putInt("essai", 0).putLong("forceJusqua", 0).putString("prochain", "Synchronisation dans quelques secondes").apply();
                  reveil(c, System.currentTimeMillis() + 15000);
              }

              static PendingIntent intention(Context c) {
                  Intent i = new Intent(c, Alarme.class).setAction(ACTION);
                  return PendingIntent.getBroadcast(c, 1, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void reveil(Context c, long ms) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pi = intention(c);
                  if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms())
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, ms, pi);
                  else
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, ms, pi);
              }

              static void annuler(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  am.cancel(intention(c));
                  am.cancel(intentionControle(c));
              }

              /* ===== Correction automatique : contrôle de la box toutes les 30 min ===== */

              static boolean correctionActive(JSONObject cfg) { return actif(cfg) && cfg.optBoolean("correction", true); }

              static boolean boxOk(JSONObject cfg) {
                  JSONObject b = cfg.optJSONObject("box");
                  return b != null && b.optString("mac").length() == 12 && !b.optString("email").isEmpty() && !b.optString("mdp").isEmpty();
              }

              static PendingIntent intentionControle(Context c) {
                  Intent i = new Intent(c, Alarme.class).setAction(CONTROLE);
                  return PendingIntent.getBroadcast(c, 2, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void planifierControle(Context c, JSONObject cfg) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  if (!boxOk(cfg)) { am.cancel(intentionControle(c)); return; }
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + INTERVALLE_CONTROLE, intentionControle(c));
              }

              /** Après un Allumer / Couper à la main : pas de correction jusqu’au prochain ordre du planning. */
              static void noterForcage(Context c, JSONObject cfg) {
                  LocalDateTime t = Planif.prochaine(cfg, LocalDateTime.now());
                  long jusqua = t == null ? System.currentTimeMillis() + 12 * 3600000L
                          : t.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli();
                  prefs(c).edit().putLong("forceJusqua", jusqua).apply();
              }

              static String lisible(String mode) {
                  String m = mode == null ? "" : mode.substring(mode.lastIndexOf('/') + 1);
                  switch (m) {
                      case "COMFORT": return "Confort";
                      case "ECO": return "Éco";
                      case "AUTO": return "Auto";
                      case "ANTI_FROST": return "Hors-gel";
                      case "STOP": return "Arrêt";
                      default: return m;
                  }
              }

              /** Toutes les 30 min : relevé du Tywatt (s’il y en a un) + correction du mode si besoin. */
              static void controler(Context c) {
                  JSONObject cfg = config(c);
                  planifierControle(c, cfg);
                  if (!boxOk(cfg)) return;
                  String heure = LocalDateTime.now().format(HEURE);
                  Map<String, Object> v;
                  JSONObject box = cfg.optJSONObject("box");
                  try (Tydom.Session s = Tydom.Session.ouvrir(c, box.optString("mac"), box.optString("email"), box.optString("mdp"))) {
                      v = Tydom.valeurs(s.demander("GET", "/devices/data", null));
                  } catch (Exception e) {
                      if (correctionActive(cfg)) prefs(c).edit().putString("controle", "⚠️ Contrôle de " + heure + " : box injoignable").apply();
                      return;
                  }
                  Energie.noter(c, v, cfg);
                  if (!correctionActive(cfg)) return;
                  if (System.currentTimeMillis() < prefs(c).getLong("forceJusqua", 0)) {
                      prefs(c).edit().putString("controle", "Pas de contrôle à " + heure + " : forçage à la main en cours").apply();
                      return;
                  }
                  boolean allume = Planif.allumeA(cfg, LocalDateTime.now());
                  String attendu = allume ? "COMFORT" : "ECO";
                  String mode = v.get("authorization") + "/" + v.get("thermicLevel");
                  if (mode.endsWith(attendu) && !mode.startsWith("STOP")) {
                      prefs(c).edit().putString("controle", "✓ Contrôlé à " + heure + " : tout est conforme").apply();
                      return;
                  }
                  try {
                      String r = Tydom.appliquer(c, cfg, allume);
                      journal(c, "🔧 Corrigé tout seul (la box était en " + lisible(mode) + ") · " + r);
                      prefs(c).edit().putString("controle", "🔧 Corrigé à " + heure + " (la box était en " + lisible(mode) + ")").apply();
                  } catch (Exception e) {
                      journal(c, "⚠️ Correction ratée · " + e.getMessage());
                      prefs(c).edit().putString("controle", "⚠️ Correction ratée à " + heure).apply();
                  }
              }
          }
