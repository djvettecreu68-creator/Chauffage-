          package fr.hack68.chauffage;

          import java.time.LocalDate;
          import java.time.LocalDateTime;
          import java.time.temporal.ChronoUnit;
          import java.util.ArrayList;
          import java.util.List;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Calcule le poste du jour (cycle 5×8) et les heures d’allumage, comme l’écran Planning. */
          public class Planif {
              static final String[] CYCLE = {"M", "M", "A", "A", "N1", "N2", "R", "R", "R", "R"};

              static String poste(JSONObject cfg, LocalDate d) {
                  JSONObject ov = cfg.optJSONObject("overrides");
                  if (ov != null && ov.has(d.toString())) return "R";
                  LocalDate debut = LocalDate.parse(cfg.optString("debut", "2026-11-04"));
                  long n = ChronoUnit.DAYS.between(debut, d);
                  return CYCLE[(int) (((n % 10) + 10) % 10)];
              }

              static int minutes(String hhmm) {
                  String[] p = hhmm.split(":");
                  return Integer.parseInt(p[0]) * 60 + Integer.parseInt(p[1]);
              }

              static List<int[]> plages(JSONObject cfg, String poste) {
                  List<int[]> l = new ArrayList<>();
                  JSONObject pl = cfg.optJSONObject("plages");
                  JSONArray a = pl == null ? null : pl.optJSONArray(poste);
                  for (int i = 0; a != null && i < a.length(); i++) {
                      JSONArray x = a.optJSONArray(i);
                      if (x == null) continue;
                      try {
                          int d = minutes(x.getString(0)), f = minutes(x.getString(1));
                          if (f > d) l.add(new int[]{d, f});
                      } catch (Exception ignore) { }
                  }
                  return l;
              }

              static boolean allumeA(JSONObject cfg, LocalDateTime t) {
                  int m = t.getHour() * 60 + t.getMinute();
                  for (int[] p : plages(cfg, poste(cfg, t.toLocalDate())))
                      if (m >= p[0] && m < p[1]) return true;
                  return false;
              }

              /** Prochaine heure (après t) où l’état allumé/coupé change. */
              static LocalDateTime prochaine(JSONObject cfg, LocalDateTime t) {
                  boolean actuel = allumeA(cfg, t);
                  LocalDateTime meilleur = null;
                  for (int j = 0; j < 12 && meilleur == null; j++) {
                      LocalDate d = t.toLocalDate().plusDays(j);
                      List<Integer> bornes = new ArrayList<>();
                      for (int[] p : plages(cfg, poste(cfg, d))) { bornes.add(p[0]); bornes.add(p[1]); }
                      bornes.add(0);
                      bornes.sort(null);
                      for (int b : bornes) {
                          LocalDateTime dt = d.atStartOfDay().plusMinutes(b);
                          if (!dt.isAfter(t)) continue;
                          if (allumeA(cfg, dt) != actuel) { meilleur = dt; break; }
                      }
                  }
                  return meilleur;
              }
          }
