          package fr.hack68.chauffage;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Réveil programmé (et redémarrage du téléphone). */
          public class Alarme extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  final Context c = ctx.getApplicationContext();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      Pilote.synchroniser(c);
                      return;
                  }
                  final boolean controle = Pilote.CONTROLE.equals(intent.getAction());
                  final PendingResult pr = goAsync();
                  new Thread(() -> {
                      try {
                          if (controle) Pilote.controler(c); else Pilote.executer(c);
                      } finally { pr.finish(); }
                  }).start();
              }
          }
